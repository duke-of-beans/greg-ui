<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8aaf91" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6b8f71" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a6b50" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="inner" cx="45%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#a0c4a6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6b8f71" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#6b8f71" stroke-width="6" opacity="0.2"/>
  <!-- Main mark — the breathing dot -->
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>
  <!-- Inner light -->
  <circle cx="256" cy="256" r="170" fill="url(#inner)"/>
</svg>
